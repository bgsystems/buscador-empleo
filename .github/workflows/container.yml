name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test and publish
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/bgsystems/buscador-empleo:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/bgsystems/buscador-empleo
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record deployment image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Deploy ghcr.io/bgsystems/buscador-empleo@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
